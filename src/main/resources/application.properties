spring.application.name=spring-lab

spring.profiles.active=navneet

spring.datasource.url=jdbc:postgresql://localhost:5432/spring_lab
spring.datasource.username=spring_lab_user
spring.datasource.password=spring.password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

logging.level.org.springframework.security=TRACE